name: API tests

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: apps/api
        run: npm install --ignore-scripts
      - name: Run API tests
        working-directory: apps/api
        run: npm test
