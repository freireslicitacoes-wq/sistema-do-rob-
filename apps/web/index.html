<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Auto Publisher AI — Biblioteca</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:24px max(20px,calc((100% - 1080px)/2))}header h1{font-size:22px;margin:0 0 6px}header p{margin:0;color:#cbd5e1;font-size:14px}main{max-width:1080px;margin:26px auto;padding:0 18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}button{font:inherit;font-weight:600;border:1px solid #cbd5e1;background:white;border-radius:10px;padding:10px 14px;cursor:pointer}.muted{font-size:13px;color:#64748b}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:17px}.card{display:flex;align-items:center;gap:12px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}.red{background:#dc2626}.yellow{background:#d97706}.green{background:#16a34a}.card strong{font-size:26px;display:block}.card span{font-size:13px;color:#64748b}.panel h2{font-size:17px;margin:0 0 14px}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#475569}.legend span{display:flex;align-items:center;gap:7px}.list{display:grid;gap:9px}.item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid #e5e7eb;border-radius:11px;padding:13px}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;color:#64748b;margin-top:4px}.status{font-size:12px;font-weight:700;border-radius:999px;padding:6px 9px;white-space:nowrap}.status.red{background:#fee2e2;color:#991b1b}.status.yellow{background:#fef3c7;color:#92400e}.status.green{background:#dcfce7;color:#166534}.error{display:none;color:#991b1b;background:#fef2f2;padding:12px;border-radius:10px;margin-bottom:12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.item{grid-template-columns:12px minmax(0,1fr)}.status{grid-column:2;justify-self:start}}
</style></head><body><header><h1>TikTok Auto Publisher AI</h1><p>Biblioteca de vídeos · acompanhamento por situação</p></header><main>
<div class="toolbar"><div><strong>Visão geral</strong><div class="muted">Vermelho: não publicado · amarelo: programado para hoje · verde: publicado</div></div><button id="refresh">Atualizar biblioteca</button></div><div id="error" class="error" role="alert"></div>
<section class="cards"><div class="card"><i class="dot red"></i><div><strong id="notPosted">—</strong><span>Não publicados</span></div></div><div class="card"><i class="dot yellow"></i><div><strong id="today">—</strong><span>Pendentes de hoje</span></div></div><div class="card"><i class="dot green"></i><div><strong id="published">—</strong><span>Publicados</span></div></div></section>
<section class="panel"><h2>Vídeos da biblioteca</h2><div class="legend"><span><i class="dot red"></i>Não publicado</span><span><i class="dot yellow"></i>Agendado para hoje</span><span><i class="dot green"></i>Publicado</span></div><div id="items" class="list"><p class="muted">Carregando biblioteca…</p></div></section></main>
<script>
const $=id=>document.getElementById(id),labels={not_published:"Não publicado",pending_today:"Pendente de hoje",published:"Publicado"};
async function loadLibrary(){$("error").style.display="none";$("items").innerHTML='<p class="muted">Carregando biblioteca…</p>';try{const r=await fetch("/api/library/status",{headers:{accept:"application/json"}});if(!r.ok)throw new Error(r.status===503?"Banco de dados não configurado. Consulte as instruções locais.":"Não foi possível carregar a biblioteca.");const d=await r.json();$("notPosted").textContent=d.summary.not_published;$("today").textContent=d.summary.pending_today;$("published").textContent=d.summary.published;$("items").innerHTML="";if(!d.items.length){$("items").innerHTML='<p class="muted">Nenhum vídeo cadastrado ainda. Importe um arquivo para começar.</p>';return}for(const item of d.items){const row=document.createElement("article");row.className="item";const dot=document.createElement("i");dot.className="dot "+(item.visual_status==="published"?"green":item.visual_status==="pending_today"?"yellow":"red");const body=document.createElement("div"),name=document.createElement("div"),meta=document.createElement("div");name.className="name";name.textContent=item.original_name;meta.className="meta";const details=[item.scheduled_at?"Agendado: "+new Date(item.scheduled_at).toLocaleString("pt-BR"):null,item.published_at?"Publicado: "+new Date(item.published_at).toLocaleString("pt-BR"):null,item.publication_status?"Situação: "+item.publication_status:"Sem publicação programada"].filter(Boolean);meta.textContent=details.join(" · ");body.append(name,meta);const badge=document.createElement("span");badge.className="status "+(item.visual_status==="published"?"green":item.visual_status==="pending_today"?"yellow":"red");badge.textContent=labels[item.visual_status]||labels.not_published;row.append(dot,body,badge);$("items").append(row)}}catch(e){$("items").innerHTML='<p class="muted">A biblioteca não pôde ser carregada.</p>';$("error").textContent=e.message;$("error").style.display="block"}}
$("refresh").addEventListener("click",loadLibrary);loadLibrary();
</script></body></html>
