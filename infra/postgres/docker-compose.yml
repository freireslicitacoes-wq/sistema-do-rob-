services:
  postgres:
    image: postgres:17-alpine
    container_name: tapai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiktok_auto_publisher
      POSTGRES_USER: tapai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tapai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapai -d tiktok_auto_publisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      psql -h postgres -U tapai -d tiktok_auto_publisher
      -v ON_ERROR_STOP=1 -f /migrations/001_initial_schema.sql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tapai-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      SERVICE_NAME: tiktok-auto-publisher-api
      DATABASE_URL: postgresql://tapai:${POSTGRES_PASSWORD:-local_dev_only_change_me}@postgres:5432/tiktok_auto_publisher
      MEDIA_STORAGE_DIR: /data/media
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tapai_media_data:/data/media

volumes:
  tapai_postgres_data:
  tapai_media_data:
